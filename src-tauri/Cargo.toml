[package]
name = "tidyfile"
version = "0.1.0"
description = "Rule-based file organizer for Windows, macOS and Linux"
authors = ["Tidyfile contributors"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.85"

[lib]
name = "tidyfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
trash = "5.2.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1.13.1"
globset = "0.4.19"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[dev-dependencies]
tempfile = "3.27.0"

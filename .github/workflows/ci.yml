name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Tauri crates and npm packages match
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const meta = JSON.parse(execSync("cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml", { maxBuffer: 1e9 }));
            const crate = (name) => meta.packages.find((p) => p.name === name).version;
            const npm = (name) => JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, "utf8")).version;
            const minor = (version) => version.split(".").slice(0, 2).join(".");
            const pairs = [["tauri", "@tauri-apps/api"], ["tauri-plugin-dialog", "@tauri-apps/plugin-dialog"]];
            const apart = pairs.filter(([c, n]) => minor(crate(c)) !== minor(npm(n)));
            for (const [c, n] of apart) console.log(`::error::${c} ${crate(c)} and ${n} ${npm(n)} differ; the Tauri CLI refuses to build them together`);
            process.exit(apart.length ? 1 : 0);
          '

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Offline guarantee
        shell: bash
        working-directory: src-tauri
        run: |
          linked=$(cargo tree -e normal --prefix none --no-dedupe \
            | awk '{print $1}' | sort -u \
            | grep -xE 'reqwest|hyper|h2|ureq|curl|attohttpc|isahc|surf|tungstenite|minreq|rustls|native-tls|openssl|openssl-sys' || true)
          if [ -n "$linked" ]; then
            echo "::error::Network crates linked into the binary: $linked"
            echo "Tidyfile promises zero network access. See DOCUMENTATION.md invariant I7."
            exit 1
          fi
          echo "No network stack linked."

      - name: Test
        working-directory: src-tauri
        run: cargo test --all

      - name: Build
        working-directory: src-tauri
        run: cargo build --release
